name: co

services:
  api:
    build:
      context: .
      provenance: false
      sbom: false
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      provenance: false
      sbom: false
    command: python -m orchestrator.workers.dispatch --poll-interval 5
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: outreach_orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d outreach_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
