[project]
name = "ai-compliance-orchestrator"
version = "0.1.0"
description = "Demo compliant outreach orchestration service inspired by regulated servicing workflows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "httpx>=0.28.1",
    "pip-audit>=2.7.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.2.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests"]
